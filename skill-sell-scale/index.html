<!DOCTYPE html>
<html lang="en">
<head>

<meta name="description" content="Find out exactly what you could sell online, what to charge, and how to build it into a business — in under 10 minutes." />

<link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
<script src="https://assets.calendly.com/assets/external/widget.js" async></script>
<style>
  :root {
    --bg: #000000;
    --bg-elevated: #0A0A0A;
    --bg-card: #111111;
    --bg-card-hover: #161616;
    --border: rgba(255, 255, 255, 0.12);
    --border-subtle: rgba(255, 255, 255, 0.06);
    --border-strong: rgba(255, 255, 255, 0.22);
    --accent: #B8E986;
    --accent-dim: rgba(184, 233, 134, 0.15);
    --accent-glow: rgba(184, 233, 134, 0.08);
    --accent-strong: rgba(184, 233, 134, 0.35);
    --text-primary: #E6E8DA;
    --text-secondary: rgba(230, 232, 218, 0.7);
    --text-muted: rgba(255, 255, 255, 0.4);
    --red: #FF6B5A;

    --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-serif: 'Instrument Serif', Georgia, serif;

    --radius-sm: 6px;
    --radius: 12px;
    --radius-lg: 20px;
    --shadow: 0 14px 40px var(--accent-dim);
    --shadow-soft: 0 8px 24px rgba(0,0,0,0.4);

    --max: 720px;
    --max-wide: 960px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-body);
    color: var(--text-primary);
    background: var(--bg);
    line-height: 1.55;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(900px 500px at 80% -10%, var(--accent-glow), transparent 60%),
      radial-gradient(700px 400px at 0% 110%, var(--accent-glow), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  h1, h2, h3, h4 {
    font-family: var(--font-body);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1.1;
    color: var(--text-primary);
  }
  h1 em, h2 em, h3 em, .serif-em {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  p { color: var(--text-secondary); }
  p strong { color: var(--text-primary); font-weight: 700; }
  a { color: var(--accent); text-decoration: none; }

  /* Shell */
  .stage {
    position: relative; z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; flex-direction: column;
  }
  .topbar {
    padding: 24px 32px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--border-subtle);
    background: #000000;
    position: sticky; top: 0; z-index: 10;
  }
  /* CTA pill in the topbar — only shown on the saved roadmap page. */
  .topbar-cta {
    appearance: none; border: 0; cursor: pointer;
    background: var(--accent);
    color: #0A1606;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 10px 18px;
    border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: transform 220ms ease, box-shadow 220ms ease;
    box-shadow: 0 4px 18px var(--accent-dim);
  }
  .topbar-cta:hover { transform: translateY(-1px); box-shadow: 0 8px 24px var(--accent-dim); }
  .topbar-cta:active { transform: translateY(0); }
  .topbar-cta .arrow { display: inline-block; transition: transform 200ms ease; }
  .topbar-cta:hover .arrow { transform: translateY(2px); }
  .topbar-cta[hidden] { display: none; }
  @media (max-width: 480px) {
    .topbar-cta { padding: 8px 14px; font-size: 12px; }
  }
  .brand { display: inline-flex; align-items: center; text-decoration: none; }
  .brand-logo {
    display: block;
    height: 38px;
    width: auto;
  }
  @media (max-width: 480px) {
    .brand-logo { height: 30px; }
  }

  /* Hero "Scale" — angled SVG pen-underline that draws itself in. */
  .hero-scale {
    position: relative;
    display: inline-block;
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
    font-size: 1.15em;
    letter-spacing: -0.02em;
    padding: 0 0.02em 0.22em;
  }
  .hero-underline {
    position: absolute;
    left: -2%;
    right: -2%;
    bottom: -0.04em;
    width: 104%;
    height: 0.34em;
    overflow: visible;
    pointer-events: none;
  }
  .hero-underline path {
    stroke-dasharray: 240;
    stroke-dashoffset: 240;
    animation: penStroke 880ms cubic-bezier(0.45, 0.05, 0.55, 0.95) 700ms forwards;
    filter: drop-shadow(0 0 8px var(--accent-strong));
  }
  @keyframes penStroke {
    to { stroke-dashoffset: 0; }
  }
  .progress-shell { flex: 1; max-width: 260px; }
  .progress-meta {
    display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 8px;
    font-weight: 500;
  }
  .progress-track {
    height: 2px; background: var(--border-subtle); border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    border-radius: 999px;
    width: 0%;
    box-shadow: 0 0 12px var(--accent-strong);
    transition: width 480ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .stage > main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 64px 24px 80px;
  }
  .screen {
    width: 100%;
    max-width: var(--max);
    opacity: 0;
    transform: translateY(12px);
    animation: rise 520ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .screen-wide { max-width: var(--max-wide); }

  /* Landing */
  .landing { text-align: center; padding: 20px 0 0; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: 0.08em;
    color: var(--text-secondary);
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255,255,255,0.02);
    margin-bottom: 32px;
  }
  .hero-badge-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-strong);
  }
  h1.display {
    font-size: clamp(48px, 8vw, 88px);
    font-weight: 700;
    line-height: 0.96;
    letter-spacing: -0.05em;
    margin-bottom: 28px;
  }
  h1.display em { font-size: 1.15em; }
  .lede {
    font-size: clamp(17px, 2.2vw, 20px);
    color: var(--text-secondary);
    max-width: 560px;
    margin: 0 auto 44px;
    line-height: 1.5;
  }

  /* Buttons */
  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 17px 30px;
    border-radius: 999px;
    transition: transform 220ms ease, background 200ms ease, box-shadow 220ms ease, border-color 200ms ease, color 200ms ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-primary {
    background: var(--accent);
    color: #0A1606;
    box-shadow: 0 8px 30px var(--accent-dim);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 40px var(--accent-dim); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: transparent;
    color: var(--text-primary);
    border: 1px solid var(--border-strong);
  }
  .btn-secondary:hover { border-color: var(--accent); background: var(--accent-glow); color: var(--accent); }
  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    padding: 14px 18px;
    font-weight: 500;
  }
  .btn-ghost:hover { color: var(--text-primary); }
  .btn .arrow { transition: transform 240ms ease; display: inline-block; }
  .btn:hover .arrow { transform: translateX(4px); }

  /* Proof strip */
  .proof {
    margin-top: 72px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border-subtle);
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    max-width: 720px;
    margin-left: auto; margin-right: auto;
  }
  .proof-item {
    background: var(--bg);
    padding: 28px 20px;
    text-align: center;
  }
  .proof-num {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 36px;
    color: var(--accent);
    letter-spacing: -0.02em;
    display: block;
    margin-bottom: 6px;
    line-height: 1;
  }
  .proof-label {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* Question screen */
  .phase-tag {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 22px;
    font-weight: 600;
  }
  .phase-tag::before {
    content: "";
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-strong);
  }
  .question {
    font-size: clamp(28px, 4.4vw, 44px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.035em;
    margin-bottom: 16px;
  }
  .question-help {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 32px;
    line-height: 1.5;
  }

  /* Inputs */
  textarea, input[type="text"], input[type="email"] {
    width: 100%;
    font-family: var(--font-body);
    font-size: 17px;
    color: var(--text-primary);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    line-height: 1.5;
    resize: none;
    transition: border-color 200ms ease, box-shadow 200ms ease, background 200ms ease;
    -webkit-appearance: none;
  }
  textarea { min-height: 140px; }
  textarea:focus, input:focus {
    outline: 0;
    border-color: var(--accent);
    background: var(--bg-card-hover);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  textarea::placeholder, input::placeholder { color: var(--text-muted); }

  .choice-group { display: grid; gap: 10px; }
  .choice-group.pills {
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 8px;
  }
  @media (max-width: 540px) {
    .choice-group.pills { grid-auto-flow: row; grid-auto-columns: auto; }
  }
  .choice {
    border: 1px solid var(--border);
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    transition: border-color 200ms ease, background 200ms ease, transform 200ms ease, opacity 200ms ease;
    display: flex; align-items: center; gap: 14px;
    font-size: 16px;
    color: var(--text-primary);
    font-weight: 500;
    user-select: none;
    min-height: 60px;
  }
  .choice.pill {
    padding: 14px 16px;
    justify-content: center;
    text-align: center;
    font-size: 15px;
    min-height: 52px;
  }
  .choice.pill .marker { display: none; }
  .choice:hover { border-color: var(--accent); background: var(--bg-card-hover); transform: translateY(-1px); }
  .choice.selected {
    border-color: var(--accent);
    background: var(--accent-glow);
  }
  .choice.disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .choice.disabled:hover {
    transform: none;
    border-color: var(--border);
    background: var(--bg-card);
  }

  /* Radio marker (single-select) */
  .choice .marker {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    flex-shrink: 0;
    transition: all 200ms ease;
    position: relative;
  }
  .choice.selected .marker { border-color: var(--accent); }
  .choice.selected .marker::after {
    content: "";
    position: absolute; inset: 3px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-strong);
  }

  /* Checkbox marker (multi-select) */
  .choice.multi .marker {
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
  }
  .choice.multi.selected .marker {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 8px var(--accent-strong);
  }
  .choice.multi.selected .marker::after {
    content: "✓";
    position: static;
    inset: auto;
    width: auto; height: auto;
    color: #0A1606;
    font-size: 14px;
    font-weight: 900;
    line-height: 1;
    background: transparent;
    border-radius: 0;
    box-shadow: none;
    transform: translateY(-0.5px);
  }

  /* Multi-select counter */
  .choice-counter {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 600;
  }
  .choice-counter .count-strong { color: var(--accent); }
  .choice-counter.maxed { color: var(--accent); }

  /* Inline "Other" text field */
  .other-input-wrap {
    margin-top: 12px;
    opacity: 0;
    transform: translateY(-6px);
    max-height: 0;
    overflow: hidden;
    transition: opacity 280ms ease, transform 320ms ease, max-height 320ms ease, margin 280ms ease;
  }
  .other-input-wrap.open {
    opacity: 1;
    transform: translateY(0);
    max-height: 200px;
  }

  /* Double-single layout (Q5) */
  .group { margin-bottom: 24px; }
  .group:last-child { margin-bottom: 0; }
  .group-label {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
    font-weight: 600;
  }

  /* Skip link for optional question */
  .skip-link {
    display: inline-block;
    margin-top: 18px;
    color: var(--text-muted);
    font-size: 14px;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: rgba(255,255,255,0.2);
    cursor: pointer;
    background: transparent; border: 0;
    font-family: inherit;
  }
  .skip-link:hover { color: var(--text-primary); }

  .nav-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 32px;
  }

  /* Email gate */
  .gate { text-align: center; }
  .gate-icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent-glow);
    color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 28px;
    border: 1px solid var(--accent-strong);
  }
  .gate-form {
    max-width: 440px; margin: 32px auto 0;
    display: grid; gap: 12px;
  }
  .gate-form .btn { width: 100%; }
  .gate-name-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  @media (max-width: 380px) {
    .gate-name-row { grid-template-columns: 1fr; }
  }
  .fine-print {
    font-size: 13px; color: var(--text-muted);
    margin-top: 18px; line-height: 1.5;
  }

  /* Loading */
  .loader-screen { text-align: center; max-width: 480px; }
  .loader-bar-wrap {
    height: 3px;
    background: var(--border-subtle);
    border-radius: 999px;
    overflow: hidden;
    margin: 40px auto 28px;
    max-width: 320px;
  }
  .loader-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), rgba(184, 233, 134, 0.5));
    border-radius: 999px;
    width: 0;
    box-shadow: 0 0 12px var(--accent-strong);
    animation: load 14s cubic-bezier(0.32, 0.72, 0.36, 1) forwards;
  }
  @keyframes load {
    0% { width: 0; }
    40% { width: 52%; }
    80% { width: 88%; }
    100% { width: 97%; }
  }
  .loader-msg {
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 700;
    letter-spacing: -0.03em;
    min-height: 1.2em;
    transition: opacity 400ms ease;
    color: var(--text-primary);
  }
  .loader-msg em { font-size: 1.1em; }
  .loader-msg.fade { opacity: 0; }
  .loader-sub {
    color: var(--text-muted); font-size: 14px;
    margin-top: 16px;
    letter-spacing: 0.04em;
  }

  /* Results document */
  .results { max-width: 800px; }
  .results-doc {
    background: var(--bg-elevated);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: var(--shadow-soft);
  }
  .doc-header {
    background:
      radial-gradient(800px 400px at 50% -20%, var(--accent-glow), transparent 60%),
      linear-gradient(180deg, #0F1208, var(--bg-elevated));
    border-bottom: 1px solid var(--border-subtle);
    padding: 64px 48px 52px;
    text-align: center;
    position: relative;
  }
  .doc-header::after {
    content: "";
    position: absolute; bottom: -1px; left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 2px;
    background: var(--accent);
    box-shadow: 0 0 16px var(--accent-strong);
  }
  .doc-eyebrow {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
    font-weight: 600;
  }
  .doc-title {
    font-size: clamp(34px, 5vw, 52px);
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.045em;
    margin-bottom: 14px;
  }
  .doc-title em { font-size: 1.2em; }
  .doc-meta {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .doc-body { padding: 56px 48px 64px; }

  .section + .section {
    margin-top: 56px;
    padding-top: 56px;
    border-top: 1px solid var(--border-subtle);
  }
  .section-num {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 16px;
    color: var(--accent);
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .section-title {
    font-size: clamp(26px, 3.6vw, 36px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.04em;
    margin-bottom: 28px;
  }

  .field { margin-bottom: 24px; }
  .field:last-child { margin-bottom: 0; }
  .field-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .field-value {
    font-size: 17px;
    line-height: 1.6;
    color: var(--text-secondary);
  }
  .field-value.lead {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }
  .field-value strong { color: var(--text-primary); font-weight: 700; }

  /* Price card */
  .price-card {
    background:
      radial-gradient(400px 200px at 0% 0%, var(--accent-glow), transparent 60%),
      var(--bg-card);
    border: 1px solid var(--accent-strong);
    border-radius: var(--radius);
    padding: 28px 30px;
    margin: 20px 0;
  }
  .price-card .price {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 44px;
    color: var(--accent);
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 10px;
  }
  .price-card .price-why {
    font-size: 14px; color: var(--text-secondary); line-height: 1.6;
  }

  /* Phase cards */
  .phase {
    margin-bottom: 16px;
    padding: 28px 30px;
    background: var(--bg-card);
    border-radius: var(--radius);
    border: 1px solid var(--border-subtle);
    transition: border-color 200ms ease, background 200ms ease;
  }
  .phase:hover { border-color: var(--border); }
  .phase:last-child { margin-bottom: 0; }
  .phase-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 18px;
    color: var(--text-primary);
  }
  .phase-steps {
    list-style: none;
    counter-reset: step;
    padding: 0;
  }
  .phase-steps li {
    counter-increment: step;
    padding: 14px 0 14px 44px;
    position: relative;
    color: var(--text-secondary);
    font-size: 15.5px;
    line-height: 1.55;
    border-bottom: 1px solid var(--border-subtle);
  }
  .phase-steps li:last-child { border-bottom: 0; padding-bottom: 0; }
  .phase-steps li:first-child { padding-top: 0; }
  .phase-steps li::before {
    content: counter(step, decimal-leading-zero);
    position: absolute;
    left: 0; top: 14px;
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--accent);
    font-size: 16px;
  }
  .phase-steps li:first-child::before { top: 0; }

  /* Gap section — emphasised */
  .gap-section {
    position: relative;
    background: linear-gradient(180deg, var(--accent-glow), transparent 80%), var(--bg-card);
    border: 1px solid var(--accent-strong);
    border-radius: var(--radius-lg);
    padding: 48px 44px;
    margin-top: 56px;
    overflow: hidden;
  }
  .gap-section::before {
    content: "";
    position: absolute; top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--accent);
    box-shadow: 0 0 20px var(--accent-strong);
  }
  .gap-section .gap-headline {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: clamp(24px, 3.4vw, 30px);
    line-height: 1.3;
    color: var(--accent);
    margin-bottom: 24px;
    font-weight: 400;
    letter-spacing: -0.015em;
  }
  .gap-section .gap-body {
    font-size: 17px;
    line-height: 1.65;
    color: var(--text-primary);
  }

  /* What's next + CTA card */
  .next-section { margin-top: 56px; text-align: center; }
  .next-copy {
    font-size: clamp(22px, 3vw, 28px);
    line-height: 1.3;
    color: var(--text-primary);
    max-width: 560px;
    margin: 0 auto 36px;
    font-weight: 600;
    letter-spacing: -0.025em;
  }
  .next-copy em { font-size: 1.15em; }

  .vsl-wrap {
    margin: 24px 0 36px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--bg-card);
    box-shadow: var(--shadow-soft);
  }
  .vsl-wrap wistia-player {
    display: block;
    width: 100%;
  }

  .cta-card {
    background:
      radial-gradient(500px 250px at 50% 0%, var(--accent-glow), transparent 60%),
      var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 44px 32px;
    text-align: center;
  }
  .cta-card .cta-headline {
    font-size: clamp(24px, 3.2vw, 30px);
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 14px;
  }
  .cta-card .cta-headline em { font-size: 1.15em; }
  .cta-card .cta-sub {
    font-size: 15px; color: var(--text-secondary);
    margin: 0 auto 28px; line-height: 1.55;
    max-width: 440px;
  }

  /* Errors */
  .error-box {
    background: rgba(255, 107, 90, 0.12);
    border: 1px solid rgba(255, 107, 90, 0.3);
    color: var(--red);
    padding: 14px 18px;
    border-radius: var(--radius);
    font-size: 14px;
    margin-bottom: 4px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 32px 24px;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    border-top: 1px solid var(--border-subtle);
    position: relative; z-index: 1;
  }

  /* Mobile */
  @media (max-width: 720px) {
    .topbar { padding: 18px 20px; }
    .progress-shell { max-width: 170px; }
    .stage > main { padding: 40px 18px 60px; }
    .proof { grid-template-columns: 1fr; max-width: 360px; }
    .proof-item { padding: 22px 16px; border-bottom: 1px solid var(--border-subtle); }
    .proof-item:last-child { border-bottom: 0; }
    .doc-header { padding: 44px 24px 36px; }
    .doc-body { padding: 36px 24px 44px; }
    .section + .section { margin-top: 44px; padding-top: 44px; }
    .gap-section { padding: 36px 28px; margin-top: 44px; }
    .phase { padding: 22px; }
    .cta-card { padding: 32px 22px; }
    .price-card { padding: 22px; }
    .price-card .price { font-size: 36px; }
    .question { font-size: 26px; }
  }

  @media (max-width: 420px) {
    .topbar { padding: 16px; }
    .brand { font-size: 14px; letter-spacing: 0.16em; }
    .progress-shell { max-width: 120px; }
    .progress-meta { font-size: 10px; }
    .doc-header { padding: 36px 20px 30px; }
    .doc-body { padding: 28px 20px 36px; }
    .gap-section { padding: 28px 22px; }
    .btn { padding: 15px 24px; font-size: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="stage">
  <header class="topbar">
    <a class="brand" href="/" aria-label="SCALO"><img class="brand-logo" src="/skill-sell-scale/logo.png?v=7" alt="SCALO" /></a>
    <button class="topbar-cta" id="topbarCta" hidden>Next steps <span class="arrow">↓</span></button>
    <div class="progress-shell" id="progressShell" hidden>
      <div class="progress-meta">
        <span id="phaseLabel">Phase 1 of 3</span>
        <span id="phaseStep">Skill</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>

  <main id="main"></main>

  <footer class="footer">© <span id="year"></span> SCALO · buildwithscalo.com</footer>
</div>

<script>
// ---------- Config ----------
const CONFIG = {
  GENERATE_ROADMAP_URL: "https://generate-roadmap.timbrace14.workers.dev",
  SUBSCRIBE_URL: "https://subscribe-deploy.timbrace14.workers.dev",
  CALENDLY_URL: "https://calendly.com/timbrace14/scalo-discovery-call",
};

// ---------- Questions ----------
// Types:
//   "single"        — pick one
//   "single-other"  — pick one; the "Other" option reveals an inline text input
//   "multi"         — pick up to `max` options
//   "multi-other"   — multi-select with an "Other" option that reveals a text input
//   "double-single" — two separate single-selects on one screen (groups)
//   "optional-text" — short free text, can be skipped
const QUESTIONS = [
  { id: "q1", phase: 1, phaseLabel: "Skill", n: 1, type: "single-other",
    prompt: "What do you do for a living?",
    help: "Pick the closest — if it's not here, hit Other and tell us in a few words.",
    choices: [
      "Hair, Barbering or Beauty",
      "Fitness or Personal Training",
      "Body work (massage, tattoo, lashes, physio…)",
      "Coaching, Therapy or Wellness",
      "Trades (plumber, sparky, builder…)",
      "Creative (photo, video, design…)",
      "Other",
    ],
    otherLabel: "Other",
    otherPlaceholder: "Tell us what you do, in a few words",
  },
  { id: "q2a", phase: 1, phaseLabel: "Skill", n: 2, type: "single",
    prompt: "How long have you been doing it?",
    help: "Just a rough bracket — no need to be exact.",
    choices: ["Under a year", "1–3 years", "3–5 years", "5–10 years", "10+ years"],
  },
  { id: "q2b", phase: 1, phaseLabel: "Skill", n: 3, type: "single",
    prompt: "Roughly how much do you earn from it each month?",
    help: "Honest answer — no judgment. This shapes how realistic your roadmap will be.",
    choices: ["Under £2K", "£2–4K", "£4–6K", "£6–10K", "£10K+"],
  },
  { id: "q3", phase: 1, phaseLabel: "Skill", n: 4, type: "multi-other",
    prompt: "What do people come to you for help with?",
    help: "Pick up to 3. Think DMs, conversations, friends, clients — what do they keep asking?",
    max: 3,
    choices: [
      "The craft itself — technique, doing what I do",
      "Getting started in my field",
      "Getting more clients or customers",
      "Pricing or charging more",
      "Confidence and mindset",
      "Running the business side",
      "Social media and personal brand",
      "Something specific to my industry",
    ],
    otherLabel: "Something specific to my industry",
    otherPlaceholder: "Tell us what they ask about",
  },

  { id: "q4", phase: 2, phaseLabel: "Sell", n: 5, type: "single",
    prompt: "Have you ever taught, coached, or helped anyone with your skill?",
    help: "Counts: friends, family, juniors at work, a one-off favour.",
    choices: ["Yes", "A bit", "No"],
  },
  { id: "q5", phase: 2, phaseLabel: "Sell", n: 6, type: "double-single",
    prompt: "Who would you most love to help?",
    help: "Pick their age range and where they're at right now.",
    groups: [
      { id: "age", label: "Age", choices: ["18–25", "25–35", "35–45", "45+"] },
      { id: "stage", label: "Where they're at", choices: [
        "Total beginner",
        "Just starting out",
        "Stuck in the middle",
        "Experienced but stuck",
        "Established, wants more",
      ]},
    ],
  },
  { id: "q6", phase: 2, phaseLabel: "Sell", n: 7, type: "single-other",
    prompt: "If you could fix ONE thing for them, what would it be?",
    help: "The one thing that, if you solved it, would change everything for them.",
    choices: [
      "Help them get good faster",
      "Help them earn more from work they already do",
      "Help them stop undercharging",
      "Help them attract better clients",
      "Help them turn their skill into an online income",
      "Help them build a personal brand",
      "Other",
    ],
    otherLabel: "Other",
    otherPlaceholder: "Tell us in one line",
  },

  { id: "q7", phase: 3, phaseLabel: "Scale", n: 8, type: "multi",
    prompt: "In 2 years, the life you actually want…",
    help: "Pick your top 2 — the things that matter most.",
    max: 2,
    choices: [
      "More money, same hours",
      "Same money, half the hours",
      "Working from anywhere",
      "Only clients I love",
      "Stepping back from the day-to-day",
      "Building a brand or team bigger than me",
      "Recurring or passive income",
    ],
  },
  { id: "q8", phase: 3, phaseLabel: "Scale", n: 9, type: "multi-other",
    prompt: "What's the real blocker right now?",
    help: "Pick up to 2 — be honest. Whatever's actually stopping you.",
    max: 2,
    choices: [
      "I don't know where to start",
      "I don't have the time",
      "I'm not sure who'd pay me",
      "I'm scared to charge proper money",
      "I'm not confident on camera or online",
      "I've started and stalled before",
      "The tech overwhelms me",
      "Other",
    ],
    otherLabel: "Other",
    otherPlaceholder: "Tell us in one line",
  },
  { id: "q9", phase: 3, phaseLabel: "Scale", n: 10, type: "optional-text", optional: true,
    prompt: "Anything else you want me to know?",
    help: "Totally optional — skip if you want. One line if there's something specific (followers, a past attempt, a deadline, a constraint).",
    placeholder: "e.g. \"I already have 5K Instagram followers\" or \"I tried this last year and stalled at the launch\"…",
  },
];
const TOTAL_QUESTIONS = QUESTIONS.length;
const MANDATORY_COUNT = QUESTIONS.filter(q => !q.optional).length;

const LOADER_MESSAGES = [
  "Analysing your skill set…",
  "Mapping your online offer…",
  "Pricing your programme…",
  "Building your 90-day plan…",
  "Almost there…",
];

// ---------- State ----------
const state = {
  step: "landing",
  answers: {},
  firstName: "",
  lastName: "",
  email: "",
  roadmap: null,
  slug: null,
  error: null,
};
const fullName = () => [state.firstName, state.lastName].filter(Boolean).join(" ");

// ---------- Helpers ----------
const $ = (sel, root = document) => root.querySelector(sel);
const el = (html) => {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
const escapeHtml = (s = "") => String(s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

function setProgress(phase, n) {
  const shell = $("#progressShell");
  if (!phase) { shell.hidden = true; return; }
  shell.hidden = false;
  // Cap progress at the mandatory count so Q9 (bonus) still shows as "almost done", not >100%.
  const pct = Math.min(100, Math.round((n / MANDATORY_COUNT) * 100));
  $("#progressFill").style.width = pct + "%";
  $("#phaseLabel").textContent = `Phase ${phase} of 3`;
  $("#phaseStep").textContent = ["Skill", "Sell", "Scale"][phase - 1];
}

function renderShell(inner) {
  const main = $("#main");
  main.innerHTML = "";
  main.appendChild(el(inner));
  // Topbar CTA hidden by default — only the results screen flips it on.
  const cta = document.getElementById("topbarCta");
  if (cta) cta.hidden = true;
}

function showTopbarCta() {
  const cta = document.getElementById("topbarCta");
  if (!cta) return;
  cta.hidden = false;
  cta.onclick = () => {
    document.querySelector(".next-section")?.scrollIntoView({ behavior: "smooth", block: "start" });
  };
}

// ---------- Screens ----------
function renderLanding() {
  state.step = "landing";
  setProgress(null);
  renderShell(`
    <section class="screen landing">
      <span class="hero-badge"><span class="hero-badge-dot"></span><span>A free roadmap from SCALO</span></span>
      <h1 class="display">Skill, Sell,<br><span class="hero-scale">Scale.<svg class="hero-underline" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true"><path d="M2 11 Q 100 2 198 6" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke" /></svg></span></h1>
      <p class="lede">Find out exactly what you could sell online, what to charge, and how to build it into a business — in under 10 minutes.</p>
      <button class="btn btn-primary" id="startBtn">Build my roadmap <span class="arrow">→</span></button>
      <div class="proof">
        <div class="proof-item"><span class="proof-num">$500K</span><span class="proof-label">Added in ARR</span></div>
        <div class="proof-item"><span class="proof-num">10 min</span><span class="proof-label">From answers to plan</span></div>
        <div class="proof-item"><span class="proof-num">100%</span><span class="proof-label">Built around you</span></div>
      </div>
    </section>
  `);
  $("#startBtn").addEventListener("click", () => renderQuestion(0));
}

function renderQuestion(index) {
  const q = QUESTIONS[index];
  state.step = q.id;
  setProgress(q.phase, q.n);

  // Initialise answer shape per type, preserving prior answers.
  if (!(q.id in state.answers)) {
    if (q.type === "multi" || q.type === "multi-other") state.answers[q.id] = { values: [], custom: "" };
    else if (q.type === "single-other") state.answers[q.id] = { value: "", custom: "" };
    else if (q.type === "double-single") state.answers[q.id] = {};
    else state.answers[q.id] = "";
  }
  const A = state.answers[q.id];

  const isLast = index === QUESTIONS.length - 1;
  const backDisabled = index === 0;

  const stepLabel = q.optional
    ? `Bonus · ${q.phaseLabel} · skip if you want`
    : `Phase ${q.phase} · ${q.phaseLabel} · Question ${q.n} of ${MANDATORY_COUNT}`;

  // ---- build the input block per type ----
  let inputHtml = "";
  if (q.type === "single" || q.type === "single-other") {
    const sel = q.type === "single-other" ? A.value : A;
    inputHtml = `
      <div class="choice-group" id="choices">
        ${q.choices.map(c => `
          <label class="choice ${sel === c ? "selected" : ""}" data-value="${escapeHtml(c)}">
            <span class="marker"></span>
            <span>${escapeHtml(c)}</span>
          </label>
        `).join("")}
      </div>
    `;
    if (q.type === "single-other") {
      const open = sel === q.otherLabel;
      inputHtml += `
        <div class="other-input-wrap ${open ? "open" : ""}" id="otherWrap">
          <input type="text" id="otherInput" placeholder="${escapeHtml(q.otherPlaceholder || "")}" value="${escapeHtml(A.custom || "")}" />
        </div>
      `;
    }
  } else if (q.type === "multi" || q.type === "multi-other") {
    const sels = A.values || [];
    inputHtml = `
      <div class="choice-counter" id="counter">
        <span>Pick up to ${q.max}</span>
        <span><span class="count-strong" id="countNum">${sels.length}</span> of ${q.max} selected</span>
      </div>
      <div class="choice-group" id="choices">
        ${q.choices.map(c => {
          const isSel = sels.includes(c);
          const disabled = !isSel && sels.length >= q.max;
          return `
            <label class="choice multi ${isSel ? "selected" : ""} ${disabled ? "disabled" : ""}" data-value="${escapeHtml(c)}">
              <span class="marker"></span>
              <span>${escapeHtml(c)}</span>
            </label>
          `;
        }).join("")}
      </div>
    `;
    if (q.type === "multi-other") {
      const open = sels.includes(q.otherLabel);
      inputHtml += `
        <div class="other-input-wrap ${open ? "open" : ""}" id="otherWrap">
          <input type="text" id="otherInput" placeholder="${escapeHtml(q.otherPlaceholder || "")}" value="${escapeHtml(A.custom || "")}" />
        </div>
      `;
    }
  } else if (q.type === "double-single") {
    inputHtml = q.groups.map(g => {
      const sel = A[g.id] || "";
      const isAgeRow = g.id === "age";
      return `
        <div class="group">
          <div class="group-label">${escapeHtml(g.label)}</div>
          <div class="choice-group ${isAgeRow ? "pills" : ""}" data-group="${escapeHtml(g.id)}">
            ${g.choices.map(c => `
              <label class="choice ${isAgeRow ? "pill" : ""} ${sel === c ? "selected" : ""}" data-value="${escapeHtml(c)}">
                ${isAgeRow ? "" : '<span class="marker"></span>'}
                <span>${escapeHtml(c)}</span>
              </label>
            `).join("")}
          </div>
        </div>
      `;
    }).join("");
  } else if (q.type === "optional-text") {
    inputHtml = `<textarea id="answerInput" placeholder="${escapeHtml(q.placeholder || "")}" rows="3">${escapeHtml(A || "")}</textarea>`;
  }

  // ---- assemble screen ----
  renderShell(`
    <section class="screen">
      <div class="phase-tag">${escapeHtml(stepLabel)}</div>
      <h2 class="question">${escapeHtml(q.prompt)}</h2>
      <p class="question-help">${escapeHtml(q.help)}</p>
      ${inputHtml}
      <div class="nav-row">
        ${backDisabled ? "<span></span>" : `<button class="btn btn-ghost" id="backBtn">← Back</button>`}
        <button class="btn btn-primary" id="nextBtn">${isLast ? "Build my roadmap" : "Continue"} <span class="arrow">→</span></button>
      </div>
      ${q.optional ? `<div style="text-align:center;"><button class="skip-link" id="skipBtn">Skip — I've said enough</button></div>` : ""}
    </section>
  `);

  if (!backDisabled) $("#backBtn").addEventListener("click", () => renderQuestion(index - 1));

  const goNext = () => {
    if (isLast) renderGate();
    else renderQuestion(index + 1);
  };

  // ---- wire interactions per type ----
  if (q.type === "single" || q.type === "single-other") {
    const choices = document.querySelectorAll("#choices .choice");
    const otherWrap = $("#otherWrap");
    const otherInput = $("#otherInput");

    const selectValue = (v) => {
      choices.forEach(x => x.classList.toggle("selected", x.dataset.value === v));
      if (q.type === "single") {
        state.answers[q.id] = v;
      } else {
        state.answers[q.id].value = v;
        if (otherWrap) {
          const showOther = v === q.otherLabel;
          otherWrap.classList.toggle("open", showOther);
          if (showOther && otherInput) setTimeout(() => otherInput.focus(), 280);
        }
      }
    };

    choices.forEach(c => c.addEventListener("click", () => selectValue(c.dataset.value)));

    if (otherInput) {
      otherInput.addEventListener("input", e => { state.answers[q.id].custom = e.target.value.trim(); });
    }
  }

  if (q.type === "multi" || q.type === "multi-other") {
    const choices = document.querySelectorAll("#choices .choice");
    const counter = $("#counter");
    const countNum = $("#countNum");
    const otherWrap = $("#otherWrap");
    const otherInput = $("#otherInput");

    const refresh = () => {
      const sels = state.answers[q.id].values;
      choices.forEach(x => {
        const v = x.dataset.value;
        const isSel = sels.includes(v);
        x.classList.toggle("selected", isSel);
        x.classList.toggle("disabled", !isSel && sels.length >= q.max);
      });
      countNum.textContent = sels.length;
      counter.classList.toggle("maxed", sels.length >= q.max);
      if (q.type === "multi-other" && otherWrap) {
        const showOther = sels.includes(q.otherLabel);
        otherWrap.classList.toggle("open", showOther);
        if (showOther && otherInput && document.activeElement !== otherInput) setTimeout(() => otherInput.focus(), 280);
      }
    };

    choices.forEach(c => {
      c.addEventListener("click", () => {
        const v = c.dataset.value;
        const sels = state.answers[q.id].values;
        const i = sels.indexOf(v);
        if (i >= 0) sels.splice(i, 1);
        else if (sels.length < q.max) sels.push(v);
        else { // already at max — flash counter
          counter.style.color = "var(--red)";
          setTimeout(() => { counter.style.color = ""; }, 700);
          return;
        }
        refresh();
      });
    });

    if (otherInput) {
      otherInput.addEventListener("input", e => { state.answers[q.id].custom = e.target.value.trim(); });
    }
  }

  if (q.type === "double-single") {
    q.groups.forEach(g => {
      const groupEl = document.querySelector(`[data-group="${g.id}"]`);
      const choices = groupEl.querySelectorAll(".choice");
      choices.forEach(c => {
        c.addEventListener("click", () => {
          choices.forEach(x => x.classList.toggle("selected", x === c));
          state.answers[q.id][g.id] = c.dataset.value;
        });
      });
    });
  }

  if (q.type === "optional-text") {
    const ta = $("#answerInput");
    ta.focus();
    ta.addEventListener("input", e => { state.answers[q.id] = e.target.value.trim(); });
    ta.addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); goNext(); }
    });
    $("#skipBtn").addEventListener("click", () => { state.answers[q.id] = ""; goNext(); });
  }

  // ---- validation ----
  const flashError = (selector) => {
    const elt = $(selector);
    if (!elt) return;
    const prev = elt.style.outline;
    elt.style.outline = "1px solid var(--red)";
    elt.style.outlineOffset = "4px";
    elt.style.borderRadius = "10px";
    setTimeout(() => { elt.style.outline = prev; }, 1400);
    elt.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  $("#nextBtn").addEventListener("click", () => {
    const a = state.answers[q.id];

    if (q.optional) { goNext(); return; }

    if (q.type === "single") {
      if (!a) return flashError("#choices");
    } else if (q.type === "single-other") {
      if (!a.value) return flashError("#choices");
      if (a.value === q.otherLabel && (!a.custom || a.custom.length < 2)) return flashError("#otherInput");
    } else if (q.type === "multi") {
      if (!a.values || a.values.length === 0) return flashError("#choices");
    } else if (q.type === "multi-other") {
      if (!a.values || a.values.length === 0) return flashError("#choices");
      if (a.values.includes(q.otherLabel) && (!a.custom || a.custom.length < 2)) return flashError("#otherInput");
    } else if (q.type === "double-single") {
      const missing = q.groups.find(g => !a[g.id]);
      if (missing) return flashError(`[data-group="${missing.id}"]`);
    }
    goNext();
  });
}

function renderLoader() {
  state.step = "loading";
  renderShell(`
    <section class="screen loader-screen">
      <div class="loader-msg" id="loaderMsg">${escapeHtml(LOADER_MESSAGES[0])}</div>
      <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
      <div class="loader-sub">Building something personal — give us a moment.</div>
    </section>
  `);

  let i = 0;
  const msgEl = $("#loaderMsg");
  state._loaderInterval = setInterval(() => {
    i = (i + 1) % LOADER_MESSAGES.length;
    if (!msgEl.isConnected) { clearInterval(state._loaderInterval); return; }
    msgEl.classList.add("fade");
    setTimeout(() => {
      if (!msgEl.isConnected) return;
      msgEl.textContent = LOADER_MESSAGES[i];
      msgEl.classList.remove("fade");
    }, 380);
  }, 2400);
}

async function runGeneration() {
  // Generate the roadmap FIRST so we have the slug to send to ConvertKit.
  // Then fire the subscribe call so the email link can point to the saved roadmap.
  try {
    const res = await fetch(CONFIG.GENERATE_ROADMAP_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answers: state.answers, name: fullName(), email: state.email }),
    });
    if (!res.ok) {
      const text = await res.text().catch(() => "");
      throw new Error(`Roadmap generation failed (${res.status}): ${text.slice(0, 200)}`);
    }
    const data = await res.json();
    if (!data || !data.skill_section) throw new Error("Roadmap response was malformed.");
    state.roadmap = data;
    state.slug = data.slug || null;

    // Fire subscribe — non-blocking. Pass the slug so the email link opens THEIR roadmap.
    // ConvertKit holds the link in the `roadmap_link` custom field and the automation
    // waits 30 minutes before delivering it via email.
    fetch(CONFIG.SUBSCRIBE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        firstName: state.firstName,
        lastName: state.lastName,
        email: state.email,
        roadmapSlug: state.slug,
      }),
    }).catch(err => console.warn("subscribe error:", err));

    clearInterval(state._loaderInterval);
    renderConfirmation();
  } catch (err) {
    clearInterval(state._loaderInterval);
    state.error = err.message || "Something went wrong.";
    renderError();
  }
}
